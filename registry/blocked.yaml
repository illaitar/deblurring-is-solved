out_of_scope:
  - {name: [BiT, VIDUE, UTI-VFI, BIN, DeMFI], reason: blur interpolation with their own blur synthesis}
  - {name: JCD, reason: rolling-shutter correction}
  - {name: GyroDVD, reason: needs gyroscope data}
  - {name: UHDVD, reason: 4K weights only}
  - {name: [DaBiT, LTX IC-LoRA Deblur], reason: defocus}
  - {name: FMA-Net, reason: joint x4 super-resolution}
  - {name: [DADeblur], reason: test-time adaptation on the test domain}
  - {name: [SelfHVD], reason: self-supervised on its own handheld data}
  - {name: [DAVIDE], reason: own dataset only, weights on request}
  - {name: [Blur2Vid], reason: one image to a video}
  - {name: [SVRNN], reason: Caffe + MATLAB, possible but costly}
