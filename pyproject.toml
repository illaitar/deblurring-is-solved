# The dbis package (dbis/: the networks, restore, run, train), distributed as deblurring-is-solved:
#   pip install "deblurring-is-solved @ git+https://github.com/illaitar/deblurring-is-solved"
# The weight files come from Hugging Face on first use (dbis.load).
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deblurring-is-solved"
version = "0.3.0"
description = "Deblurring networks of the 'deblurring is solved?' benchmark in plain PyTorch: dbis gives the authors' outputs, dbisf runs faster"
readme = "PACKAGE.md"
# our code MIT; the ported parts keep their terms (NOTICE): BSSTNet's ProPainter blocks are non-commercial
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND LicenseRef-S-Lab-1.0"
license-files = ["LICENSE", "NOTICE", "hf/dbis/licenses/*.txt"]
requires-python = ">=3.9"
dependencies = ["torch", "numpy", "safetensors", "zstandard", "pillow"]
keywords = ["deblurring", "motion deblurring", "video deblurring", "image restoration", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
bsst = ["torchvision"]          # BSSTNet's deformable convolutions

[project.urls]
Homepage = "https://illaitar.github.io/deblurring-is-solved/"
Source = "https://github.com/illaitar/deblurring-is-solved"
Weights = "https://huggingface.co/Illaitar"
Documentation = "https://github.com/illaitar/deblurring-is-solved/blob/main/DBIS.md"

[tool.setuptools.packages.find]
include = ["dbis*"]
exclude = ["*.__pycache__"]

[tool.setuptools.package-data]
dbis = ["train_configs.json"]

[tool.pytest.ini_options]
pythonpath = ["."]          # `pytest tests/test_losses.py` from the repository root imports dbis from here
